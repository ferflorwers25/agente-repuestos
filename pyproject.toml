[project]
name = "agente-repuestos"
version = "0.1.0"
description = "Agente de IA para consultar inventario de repuestos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
agente-repuestos-mcp = "agente_repuestos.servidor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
