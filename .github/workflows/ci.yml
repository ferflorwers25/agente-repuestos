name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: repuestos
          POSTGRES_USER: repuestos_admin
          POSTGRES_PASSWORD: ci_admin
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repuestos_admin -d repuestos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Test-only credentials. The MCP server reads them from .env,
      # just like it does on a developer machine.
      - name: Create .env
        run: |
          cat > .env <<'ENV'
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5433
          POSTGRES_DB=repuestos
          POSTGRES_USER=repuestos_admin
          POSTGRES_PASSWORD=ci_admin
          AGENTE_DB_USER=agente_lectura
          AGENTE_DB_PASSWORD=ci_lectura
          ENV

      - name: Install dependencies
        run: uv sync --locked

      - name: Load sample data
        run: uv run scripts/cargar_datos.py

      # Fails if any test is skipped: in CI the database must be reachable.
      - name: Run tests
        run: |
          uv run pytest -rs -v | tee pytest.log
          ! grep -q SKIPPED pytest.log
